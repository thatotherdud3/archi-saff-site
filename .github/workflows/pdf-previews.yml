name: generate pdf previews

on:
  push:
    branches: [main]
    paths:
      - "assets/pdfs/**"
      - ".github/workflows/pdf-previews.yml"
      - "scripts/generate_pdf_previews.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: render first page of each portfolio pdf
        run: |
          python -m pip install --disable-pip-version-check "pymupdf==1.24.14" "pillow==11.0.0"
          python scripts/generate_pdf_previews.py
      - name: commit updated previews
        run: |
          git add assets/previews/*.jpg
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "update pdf previews"
            git push origin HEAD:main
          fi
